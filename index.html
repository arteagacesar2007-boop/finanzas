<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#09090b">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body class="out">
<title>Control de Patrimonio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con filtros globales (espacio + periodo), tira de pestañas, una sola columna de trabajo con rejillas que se apilan en el celular. */
:root{
  color-scheme:dark;
  --bg:#09090b; --surface:#101013; --raise:#17171b; --line:#24242a; --line2:#34343c;
  --fg:#ececf1; --mute:#9494a0; --dim:#62626e;
  --pos:#7fd1a4; --neg:#ee8a80; --warn:#e2c078;
  --sans:"Geist",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .mute{color:var(--mute)}

.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .wrap{display:flex;flex-direction:column;gap:14px;padding-block:18px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.status{font-size:12px;color:var(--mute)}
.ctrl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--mute);font-size:13px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:500}
.per{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.per .lbl{min-width:132px;text-align:center;font-weight:500;text-transform:capitalize}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:16px;line-height:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--mute);white-space:nowrap;border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}

main.wrap{padding-block:22px 110px;display:flex;flex-direction:column;gap:22px}
.banner{border:1px dashed var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .num{font-size:20px;font-weight:500;overflow-wrap:anywhere}
.kpi small{color:var(--dim);font-size:12px}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--mute);font-size:13px;max-width:65ch}
.empty{color:var(--mute);font-size:13px;padding:6px 0;max-width:60ch}

.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--neg)}
.btn[data-armed]{border-color:var(--neg);color:var(--neg);background:none}

.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-weight:500;overflow-wrap:anywhere}
.row .main small{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.row .amt{text-align:right;white-space:nowrap}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button.row{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
button.row:hover{background:var(--raise)}
.day{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:14px 0 4px}
.pill{font-size:11px;border:1px solid var(--line2);border-radius:99px;padding:1px 8px;color:var(--mute);white-space:nowrap}
.pill.neg{border-color:var(--neg);color:var(--neg)} .pill.pos{border-color:var(--pos);color:var(--pos)} .pill.warn{border-color:var(--warn);color:var(--warn)}

.meter{height:6px;border-radius:3px;background:var(--raise);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:3px}
.meter i.over{background:var(--neg)} .meter i.ok{background:var(--pos)}
.meterwrap{position:relative}
.meterwrap .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0}
.catrow .meter{grid-column:1/-1}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;border-bottom:1px solid var(--line)}
.bcol{flex:1;min-width:0;height:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}
.bcol i{flex:1;max-width:18px;border-radius:3px 3px 0 0;min-height:1px}
.bcol i.p{background:var(--pos)} .bcol i.n{background:var(--neg)}
.blbl{display:flex;gap:6px}
.blbl span{flex:1;text-align:center;font-size:11px;color:var(--mute);text-transform:capitalize;min-width:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--raise)}
.split i:first-child{background:var(--fg)} .split i:last-child{background:var(--dim)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:0}
th:first-child,td:first-child{text-align:left;padding-left:0;text-transform:capitalize}
svg.line{width:100%;height:150px;display:block}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.tools input{max-width:240px}
input.bud{width:104px;text-align:right;padding:5px 8px;font-family:var(--mono)}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;border:0;background:var(--fg);color:var(--bg);font-weight:600;border-radius:99px;padding:13px 20px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .lbl{font-size:12px;color:var(--mute)}
.sheet .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .sp{flex:1}
.err{color:var(--neg);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--raise);border:1px solid var(--line2);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:no-preference){.meter i,.bcol i{transition:width .3s,height .3s}}
.gate{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate h1{font-size:22px}
.gate .two{display:flex;gap:8px;flex-wrap:wrap}
.gate .two .btn{flex:1}
.gate .link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0;font-size:13px;text-align:left}
body.out .top,body.out main,body.out .fab{display:none}
body:not(.out) .gate{display:none}
</style>

<form class="gate" id="gate" novalidate hidden>
  <h1>Control de Patrimonio</h1>
  <p class="hint" id="gateMsg">Entra con tu correo y contraseña para ver tus finanzas. Tus datos son privados: solo tu cuenta puede leerlos.</p>
  <label class="fld"><span class="lbl">Correo</span><input id="g_mail" type="email" autocomplete="username" required></label>
  <label class="fld"><span class="lbl">Contraseña (mínimo 6 caracteres)</span><input id="g_pass" type="password" autocomplete="current-password" required></label>
  <p class="err" id="gateErr" hidden></p>
  <div class="two"><button class="btn" type="submit" id="g_in">Entrar</button><button class="btn ghost" type="button" id="g_new">Crear cuenta</button></div>
  <button class="link" type="button" id="g_reset">Olvidé mi contraseña</button>
</form>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Control de Patrimonio</h1><span class="status" id="status">Conectando con tus datos…</span><span style="flex:1"></span><button class="btn ghost sm" data-act="salir">Cerrar sesión</button></div>
  <div class="ctrl">
    <div class="seg" id="espSeg" role="group" aria-label="Espacio"></div>
    <div class="per">
      <button class="ico" data-act="prev" aria-label="Periodo anterior">‹</button>
      <span class="lbl" id="perLbl"></span>
      <button class="ico" data-act="next" aria-label="Periodo siguiente">›</button>
      <div class="seg" id="modoSeg" role="group" aria-label="Vista"></div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div></header>
<main class="wrap" id="view"></main>
<button class="fab" data-act="newMov">+ Movimiento</button>
<div class="overlay" id="ov" hidden><form class="sheet" id="sheet" novalidate></form></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'});
const M=n=>money.format(Math.abs(n)<0.005?0:n||0);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?Math.round(n*100)/100:0};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ent=o=>Object.entries(o||{});
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const TODAY=iso(new Date()), NOWYM=TODAY.slice(0,7);
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ymLbl=ym=>MES[+ym.slice(5)-1]+' '+ym.slice(0,4);
const ymAdd=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);return iso(d).slice(0,7)};
const dLbl=f=>{const[y,m,d]=f.split('-');return +d+' '+MES[+m-1].slice(0,3)+' '+y};
const ESP={personal:'Personal',pareja:'Pareja',negocio:'Negocio'};
const grp=e=>e==='negocio'?'negocio':'hogar';
const HOG=e=>e==='personal'||e==='pareja', NEG=e=>e==='negocio';
const TABS=[['resumen','Resumen'],['movs','Movimientos'],['presup','Presupuesto'],['cuentas','Cuentas'],['fijos','Fijos y suscripciones'],['cobros','Por cobrar'],['inv','Inversiones'],['metas','Metas'],['patri','Patrimonio'],['ajustes','Ajustes']];
const CATS0=[
 ['Sueldo','ingreso','hogar'],['Décimos y utilidades','ingreso','hogar'],['Ingresos extra','ingreso','hogar'],['Otros ingresos','ingreso','hogar'],
 ['Vivienda','gasto','hogar','necesidad'],['Servicios básicos','gasto','hogar','necesidad'],['Alimentación','gasto','hogar','necesidad'],['Transporte','gasto','hogar','necesidad'],['Salud','gasto','hogar','necesidad'],['Educación','gasto','hogar','necesidad'],['Seguros','gasto','hogar','necesidad'],
 ['Restaurantes','gasto','hogar','gusto'],['Entretenimiento','gasto','hogar','gusto'],['Ropa y cuidado personal','gasto','hogar','gusto'],['Suscripciones','gasto','hogar','gusto'],['Regalos','gasto','hogar','gusto'],['Viajes','gasto','hogar','gusto'],['Gastos varios','gasto','hogar','gusto'],
 ['Ventas','ingreso','negocio'],['Otros ingresos del negocio','ingreso','negocio'],
 ['Mercadería e insumos','gasto','negocio'],['Arriendo del local','gasto','negocio'],['Servicios del negocio','gasto','negocio'],['Sueldos','gasto','negocio'],['Publicidad','gasto','negocio'],['Impuestos (SRI)','gasto','negocio'],['Envíos y transporte','gasto','negocio'],['Varios del negocio','gasto','negocio']
].map(([n,t,a,g])=>({n,t,a,g:g||''}));

/* ---------- estado ---------- */
const S={meses:{},cuentas:{},cobros:{},inv:{},metas:{},fijos:{},cierres:{},cfg:null};
const UI={tab:'resumen',esp:'todo',modo:'mes',ym:NOWYM,ft:'todos',q:''};
try{const s=JSON.parse(localStorage.getItem('cp_ui')||'{}');if(TABS.some(t=>t[0]===s.tab))UI.tab=s.tab;if(s.esp==='todo'||ESP[s.esp])UI.esp=s.esp}catch(e){}
const remember=()=>{try{localStorage.setItem('cp_ui',JSON.stringify({tab:UI.tab,esp:UI.esp}))}catch(e){}};
let db=null,ready=false,loaded={},B={b:{},tin:{},tout:{}},memo={};
const cats=()=>S.cfg?.cats||CATS0;
const presup=()=>S.cfg?.presup||{};
const catG=n=>cats().find(c=>c.n===n&&c.t==='gasto')?.g||'';
const T=()=>UI.esp==='todo'?()=>true:e=>e===UI.esp;

/* ---------- datos ---------- */
const chains={};
function write(path,fn){
  if(!db){toast('Inicia sesión para guardar tus datos.');return Promise.resolve()}
  const p=(chains[path]||Promise.resolve()).catch(()=>{}).then(fn);chains[path]=p;
  p.catch(e=>toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de datos. Borra registros antiguos.':'No se pudo guardar. Intenta de nuevo.'));
  return p;
}
const setDoc=(p,d)=>write(p,()=>db.doc(p).set(d));
const updDoc=(p,d)=>write(p,()=>db.doc(p).update(d));
const delDoc=p=>write(p,()=>db.doc(p).delete());
function movsOf(ym){
  if(memo[ym])return memo[ym];
  return memo[ym]=ent(S.meses[ym]?.items).filter(([,m])=>m&&m.fecha).map(([id,m])=>({...m,id,ym,monto:+m.monto||0}));
}
const movs=()=>memo.all||(memo.all=Object.keys(S.meses).flatMap(movsOf));
function perMovs(){
  if(UI.modo==='mes')return movsOf(UI.ym);
  const y=UI.ym.slice(0,4);return Object.keys(S.meses).filter(k=>k.startsWith(y)).flatMap(movsOf);
}
function saveMov(id,m,oldYm){
  const ym=m.fecha.slice(0,7);
  if(oldYm&&oldYm!==ym)updDoc('meses/'+oldYm,{items:{[id]:null}});
  if(S.meses[ym])updDoc('meses/'+ym,{items:{[id]:m}});
  else{S.meses[ym]={items:{}};setDoc('meses/'+ym,{items:{[id]:m}})}
}
const delMov=(id,ym)=>updDoc('meses/'+ym,{items:{[id]:null}});
function nodeEsp(id){
  if(!id)return undefined;
  if(id.startsWith('inv:'))return S.inv[id.slice(4)]?.espacio;
  if(id.startsWith('cob:'))return S.cobros[id.slice(4)]?.espacio;
  return S.cuentas[id]?.espacio;
}
function nodeName(id){
  if(!id)return '';
  if(id.startsWith('inv:'))return 'Inversión: '+(S.inv[id.slice(4)]?.nombre||'eliminada');
  if(id.startsWith('cob:')){const c=S.cobros[id.slice(4)];return c?(c.sentido==='pagar'?'Deuda con ':'Préstamo a ')+c.persona:'Préstamo eliminado'}
  return S.cuentas[id]?.nombre||'Cuenta eliminada';
}
const accOpts=()=>ent(S.cuentas).map(([id,c])=>[id,c.nombre+' · '+ESP[c.espacio]]);
const nodeOpts=()=>[...accOpts(),...ent(S.inv).map(([id])=>['inv:'+id,nodeName('inv:'+id)]),...ent(S.cobros).map(([id])=>['cob:'+id,nodeName('cob:'+id)])];
function balances(){
  const b={},tin={},tout={},ad=(o,k,v)=>{if(k)o[k]=(o[k]||0)+v};
  for(const m of movs()){
    if(m.fecha>TODAY)continue;
    if(m.tipo==='ingreso')ad(b,m.cuenta,m.monto);
    else if(m.tipo==='gasto')ad(b,m.cuenta,-m.monto);
    else{ad(b,m.cuenta,-m.monto);ad(b,m.destino,m.monto);ad(tout,m.cuenta,m.monto);ad(tin,m.destino,m.monto)}
  }
  return{b,tin,tout};
}
function tot(list,test){
  const r={ing:0,gas:0,cat:{},fijo:0,vari:0,nec:0,gus:0};
  for(const m of list){
    let i=0,g=0,c=m.categoria||'Sin categoría';
    if(m.tipo==='ingreso'){if(test(m.espacio))i=m.monto}
    else if(m.tipo==='gasto'){if(test(m.espacio))g=m.monto}
    else{const o=test(nodeEsp(m.cuenta)),d=test(nodeEsp(m.destino));
      if(o&&!d){g=m.monto;c='Traspaso a otro espacio'}else if(d&&!o){i=m.monto}}
    r.ing+=i;
    if(g){r.gas+=g;r.cat[c]=(r.cat[c]||0)+g;
      if(m.tipo==='gasto'){if(m.clase==='fijo')r.fijo+=g;else r.vari+=g;const k=catG(c);if(k==='necesidad')r.nec+=g;else if(k==='gusto')r.gus+=g}}
  }
  return r;
}
const saldo=id=>(+S.cuentas[id]?.saldoInicial||0)+(B.b[id]||0);
const invAp=id=>B.b['inv:'+id]||0;
const invVal=(id,v)=>v.valor===''||v.valor==null?invAp(id):+v.valor;
const cobAb=(id,c)=>(c.sentido==='pagar'?B.tin:B.tout)['cob:'+id]||0;
const cobPend=(id,c)=>Math.max(0,(+c.monto||0)-cobAb(id,c));
function worth(test){
  const w={cuentas:0,inv:0,cobrar:0,tarjetas:0,pagar:0};
  for(const[id,c]of ent(S.cuentas)){if(!test(c.espacio))continue;const s=saldo(id);if(s>=0)w.cuentas+=s;else w.tarjetas-=s}
  for(const[id,v]of ent(S.inv))if(test(v.espacio))w.inv+=invVal(id,v);
  for(const[id,c]of ent(S.cobros))if(test(c.espacio)){if(c.sentido==='pagar')w.pagar+=cobPend(id,c);else w.cobrar+=cobPend(id,c)}
  w.a=w.cuentas+w.inv+w.cobrar;w.p=w.tarjetas+w.pagar;w.n=w.a-w.p;return w;
}

const head=(t,btn)=>`<div class="ph"><h3>${t}</h3>${btn||''}</div>`;
const meter=(v,max,cls)=>`<div class="meter"><i class="${cls||''}" style="width:${Math.min(100,max>0?v/max*100:0)}%"></i></div>`;
function chartMonths(){
  const out=[],t=T();
  if(UI.modo==='mes')for(let i=5;i>=0;i--)out.push(ymAdd(UI.ym,-i));
  else for(let i=1;i<=12;i++)out.push(UI.ym.slice(0,4)+'-'+String(i).padStart(2,'0'));
  return out.map(ym=>({ym,...tot(movsOf(ym),t)}));
}
function bars(ms){
  const max=Math.max(1,...ms.flatMap(m=>[m.ing,m.gas]));
  return `<div class="bars" role="img" aria-label="Ingresos y gastos por mes">${ms.map(m=>`<div class="bcol" title="${ymLbl(m.ym)}: ingresos ${M(m.ing)}, gastos ${M(m.gas)}"><i class="p" style="height:${m.ing/max*100}%"></i><i class="n" style="height:${m.gas/max*100}%"></i></div>`).join('')}</div>
  <div class="blbl">${ms.map(m=>`<span>${MES[+m.ym.slice(5)-1].slice(0,3)}</span>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--pos)"></i>Ingresos</span><span><i style="background:var(--neg)"></i>Gastos</span><span>Tope de la escala: ${M(max)}</span></div>`;
}
function lineChart(pts){
  if(pts.length<2)return `<p class="empty">Guarda el cierre de al menos dos meses para ver la evolución.</p>`;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1,W=600,H=150,pad=10;
  const xy=pts.map((p,i)=>[(i/(pts.length-1))*W,pad+(1-(p.v-mn)/sp)*(H-2*pad)]);
  const l=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const e=xy[xy.length-1];
  return `<svg class="line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución del patrimonio neto"><polygon points="0,${H} ${l} ${W},${H}" fill="var(--raise)"></polygon><polyline points="${l}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke"></polyline><circle cx="${e[0]-3}" cy="${e[1]}" r="3" fill="var(--fg)"></circle></svg>
  <div class="blbl">${pts.map(p=>`<span>${esc(p.l)}</span>`).join('')}</div>
  <div class="legend"><span>Mínimo ${M(mn)}</span><span>Máximo ${M(mx)}</span></div>`;
}
function fijoNext(f){
  const d=new Date(),y=d.getFullYear(),dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();
  if(f.ciclo==='anual'){const mm=(+f.mes||1)-1;let x=new Date(y,mm,Math.min(+f.dia||1,dim(y,mm)));if(iso(x)<TODAY)x=new Date(y+1,mm,Math.min(+f.dia||1,dim(y+1,mm)));return iso(x)}
  let x=new Date(y,d.getMonth(),Math.min(+f.dia||1,dim(y,d.getMonth())));
  if(iso(x)<TODAY)x=new Date(y,d.getMonth()+1,Math.min(+f.dia||1,dim(y,d.getMonth()+1)));return iso(x);
}

const FIREBASE_CONFIG={"apiKey":"AIzaSyAuWUNQAi8yXrtNlvhPLLoNQzAyt5JYLwc","authDomain":"patrimonio-3a8ab.firebaseapp.com","projectId":"patrimonio-3a8ab","storageBucket":"patrimonio-3a8ab.firebasestorage.app","messagingSenderId":"1019536579086","appId":"1:1019536579086:web:83fced21b706defe49ba5f"};
function adapter(store,uid){
  const base='users/'+uid+'/';
  return {doc:p=>{const r=store.doc(base+p);return {set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot({includeMetadataChanges:true},n,e)}},
          collection:p=>{const c=store.collection(base+p);return {onSnapshot:(n,e)=>c.onSnapshot({includeMetadataChanges:true},n,e)}}};
}
function start(){
  render();
  const st=$('#status'),gate=$('#gate'),err=$('#gateErr');
  const show=t=>{err.textContent=t;err.hidden=!t};
  if(!FIREBASE_CONFIG||!window.firebase){gate.hidden=false;$('#gateMsg').textContent='La página todavía no está conectada a su base de datos. Falta agregar la configuración de Firebase.';
    gate.querySelectorAll('label,button').forEach(e=>e.hidden=true);return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),store=firebase.firestore();
  store.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const MSG={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'No existe una cuenta con ese correo.','auth/invalid-email':'Escribe un correo válido.','auth/missing-password':'Escribe tu contraseña.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/email-already-in-use':'Ya existe una cuenta con ese correo. Usa “Entrar”.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin conexión a internet.','auth/operation-not-allowed':'El acceso con correo y contraseña no está activado en Firebase.'};
  const run=p=>{show('');p.catch(e=>show(MSG[e.code]||'No se pudo completar. Intenta de nuevo.'))};
  const mail=()=>$('#g_mail').value.trim(),pass=()=>$('#g_pass').value;
  gate.addEventListener('submit',e=>{e.preventDefault();run(auth.signInWithEmailAndPassword(mail(),pass()))});
  $('#g_new').addEventListener('click',()=>run(auth.createUserWithEmailAndPassword(mail(),pass())));
  $('#g_reset').addEventListener('click',()=>{if(!mail()){show('Escribe tu correo y vuelve a tocar “Olvidé mi contraseña”.');return}
    run(auth.sendPasswordResetEmail(mail()).then(()=>show('Te enviamos un correo para cambiar la contraseña.')))});
  A.salir=()=>auth.signOut();
  let subs=[],timer=0;
  auth.onAuthStateChanged(u=>{
    subs.forEach(f=>f());subs=[];clearTimeout(timer);
    db=null;ready=false;loaded={};for(const k of Object.keys(S))S[k]=k==='cfg'?null:{};
    gate.hidden=false;document.body.classList.toggle('out',!u);
    if(!u){$('#g_pass').value='';return}
    db=adapter(store,u.uid);st.textContent='Conectando con tus datos…';render();
    const cols=['meses','cuentas','cobros','inv','metas','fijos','cierres'],need=new Set([...cols,'cfg']);
    timer=setTimeout(()=>{if(need.size)st.textContent=ready?'Sin conexión: los cambios se enviarán al reconectar.':'Tus datos tardan en responder…'},10000);
    const got=(k,meta)=>{if(!meta.fromCache)need.delete(k);loaded[k]=1;
      if(!ready&&Object.keys(loaded).length===cols.length+1)ready=true;
      if(!need.size){clearTimeout(timer);st.textContent=u.email}
      queue()};
    const fail=()=>{clearTimeout(timer);ready=true;st.textContent='Tus datos no están disponibles en este momento.';queue()};
    for(const k of cols)subs.push(db.collection(k).onSnapshot(s=>{const o={};s.docs.forEach(x=>{const v=x.data();if(v)o[x.id]=v});S[k]=o;got(k,s.metadata)},fail));
    subs.push(db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;got('cfg',s.metadata)},fail));
  });
}
start();
</script>
